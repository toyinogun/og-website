# Lint, format, type check and unit tests on every push and pull request.
# Deploys are separate: Workers Builds gates each deploy of `main` on
# `astro check && astro build` (AGENTS.md, Tooling).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check
      # The Worker's generated types must match wrangler.jsonc (spec 0006, AC-20).
      - run: npx wrangler types worker/worker-configuration.d.ts --check
      - run: npm test
      - run: npm run build
      - run: npm run test:build
